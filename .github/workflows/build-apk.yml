name: Build AI Operator PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Apply Hyperlapse beta patch
        run: |
          git apply --check Hyperlapse_V1.patch
          git apply Hyperlapse_V1.patch

      - name: Fix Kotlin permission callback
        run: |
          sed -i 's/permissions: Array<out String>/permissions: Array<String>/' app/src/main/java/com/google/jetpackcamera/HyperlapseActivity.kt
          grep -n 'override fun onRequestPermissionsResult' app/src/main/java/com/google/jetpackcamera/HyperlapseActivity.kt

      - name: Build AI Operator PRO APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStableDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Operator-PRO-Hyperlapse-APK
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
          retention-days: 14
